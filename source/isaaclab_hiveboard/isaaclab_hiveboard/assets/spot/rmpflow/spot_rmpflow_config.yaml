# Artificially limit the robot joints.
# A joint with range +-pi would be limited to +-(pi-.01)
# Updated to 6 entries to match the Spot Arm DOF
joint_limit_buffers: [.01, .01, .01, .01, .01, .01]

# RMPflow has many modifiable parameters, but these serve as a great start.
rmp_params:
    target_rmp:
        max_metric_scalar: 10000
        min_metric_scalar: 2500
        accel_p_gain: 30.
        accel_d_gain: 85.
        accel_norm_eps: .075
        min_metric_alpha: .01
        metric_alpha_length_scale: .05
        proximity_metric_boost_scalar: 20.
        proximity_metric_boost_length_scale: .02
        xi_estimator_gate_std_dev: 20000.
        accept_user_weights: false
    joint_velocity_cap_rmp:
        metric_weight: 100.
        max_velocity: 4.
        velocity_damping_region: 3.0
        damping_gain: 10.0
    cspace_target_rmp:
        metric_scalar: 50.
        position_gain: 100.
        damping_gain: 50.
        robust_position_term_thresh: .5
        inertia: 1.
    cspace_trajectory_rmp:
        weight: 50.
        p_gain: 100.
        d_gain: 10.
        ff_gain: .25
    cspace_affine_rmp:
        final_handover_time_std_dev: .25
        weight: 2000.
    collision_rmp:
        metric_scalar: 10000.
        damping_gain: 50.
        damping_std_dev: .04
        damping_robustness_eps: 1e-2
        damping_velocity_gate_length_scale: .01
        repulsion_gain: 800.
        repulsion_std_dev: .01
        metric_modulation_radius: .5
        metric_exploder_std_dev: .02
        metric_exploder_eps: .001
    axis_target_rmp:
        metric_scalar:  100
        accel_p_gain: 210.
        accel_d_gain: 60.
        proximity_metric_boost_scalar: 3000.
        proximity_metric_boost_length_scale: .08
        xi_estimator_gate_std_dev: 20000.
        accept_user_weights: false
    joint_limit_rmp:
        metric_scalar: 1000.0
        metric_length_scale: .01
        metric_exploder_eps: 1e-3
        metric_velocity_gate_length_scale: .01
        accel_damper_gain: 200.
        accel_potential_gain: 1.
        accel_potential_exploder_length_scale: .1
        accel_potential_exploder_eps: 1e-2
    damping_rmp:
        metric_scalar: 50.
        accel_d_gain: 30.
        inertia: 100.

canonical_resolve:
    max_acceleration_norm: 50.
    projection_tolerance: .01
    verbose: true

# body_cylinders are used to promote self-collision avoidance between the robot arm and its base (the quadruped body)
# Coordinates are relative to the robot base frame (link: "body")
body_cylinders:
     # This represents the main torso of Spot to prevent the arm from crushing the body.
     # Based on URDF: Arm is at x=0.292. Body extends roughly +/- 0.4m in X.
     - name: spot_torso
       pt1: [0.0, 0.0, -0.0] # Near front hips, slightly below arm mount
       pt2: [0.0, 0.0, 0.0]  # Near rear hips, slightly above arm mount
       radius: 0.01 # Generous radius to account for body width + safety margin

# body_collision_controllers defines spheres located at specified frames in the robot URDF
# These spheres will not be allowed to collide with the capsules enumerated under body_cylinders
# We add the elbow, wrist, and gripper finger to ensure no part of the arm hits the torso.
body_collision_controllers:
     - name: arm_link_el1
       radius: 0.03
     - name: arm_link_jaw
       radius: 0.03
     - name: arm_link_fngr
       radius: 0.03



