##
## Collision Spheres for Boston Dynamics Spot with Arm
## Generated for cuMotion / Isaac Sim
##
collision_spheres:
    # ------------------------------------------------
    # BODY
    # ------------------------------------------------
    body:
        # Main chassis along X axis
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.09
        - "center": [0.15, 0.0, 0.0]
          "radius": 0.09
        - "center": [-0.15, 0.0, 0.0]
          "radius": 0.09
        - "center": [0.30, 0.0, 0.0]
          "radius": 0.085
        - "center": [-0.30, 0.0, 0.0]
          "radius": 0.085
        - "center": [0.42, 0.0, 0.0]
          "radius": 0.08
        - "center": [-0.42, 0.0, 0.0]
          "radius": 0.08

    # ------------------------------------------------
    # LEGS - FRONT LEFT
    # ------------------------------------------------
    fl_hip:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.06
    fl_uleg:
        # Interpolated from hip joint to knee joint (approx -0.32m in Z)
        - "center": [0.0, 0.0, -0.05]
          "radius": 0.05
        - "center": [0.0, 0.0, -0.15]
          "radius": 0.045
        - "center": [0.0, 0.0, -0.25]
          "radius": 0.045
    fl_lleg:
        # Interpolated from knee to foot (approx -0.33m in Z)
        - "center": [0.0, 0.0, -0.05]
          "radius": 0.03
        - "center": [0.0, 0.0, -0.15]
          "radius": 0.025
        - "center": [0.0, 0.0, -0.25]
          "radius": 0.02
        - "center": [0.0, 0.0, -0.33] # Near foot
          "radius": 0.035

    # ------------------------------------------------
    # LEGS - FRONT RIGHT
    # ------------------------------------------------
    fr_hip:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.06
    fr_uleg:
        - "center": [0.0, 0.0, -0.05]
          "radius": 0.05
        - "center": [0.0, 0.0, -0.15]
          "radius": 0.045
        - "center": [0.0, 0.0, -0.25]
          "radius": 0.045
    fr_lleg:
        - "center": [0.0, 0.0, -0.05]
          "radius": 0.03
        - "center": [0.0, 0.0, -0.15]
          "radius": 0.025
        - "center": [0.0, 0.0, -0.25]
          "radius": 0.02
        - "center": [0.0, 0.0, -0.33]
          "radius": 0.035

