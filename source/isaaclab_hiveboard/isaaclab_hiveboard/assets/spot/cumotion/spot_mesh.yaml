    hl_hip:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.06
    hl_uleg:
        - "center": [0.0, 0.0, -0.05]
          "radius": 0.05
        - "center": [0.0, 0.0, -0.15]
          "radius": 0.045
        - "center": [0.0, 0.0, -0.25]
          "radius": 0.045
    hl_lleg:
        - "center": [0.0, 0.0, -0.05]
          "radius": 0.03
        - "center": [0.0, 0.0, -0.15]
          "radius": 0.025
        - "center": [0.0, 0.0, -0.25]
          "radius": 0.02
        - "center": [0.0, 0.0, -0.33]
          "radius": 0.035

    # ------------------------------------------------
