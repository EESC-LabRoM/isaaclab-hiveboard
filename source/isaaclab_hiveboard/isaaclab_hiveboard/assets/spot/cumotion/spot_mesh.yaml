    hr_hip:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.06
    hr_uleg:
        - "center": [0.0, 0.0, -0.05]
          "radius": 0.05
        - "center": [0.0, 0.0, -0.15]
          "radius": 0.045
        - "center": [0.0, 0.0, -0.25]
